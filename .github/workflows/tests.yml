name: Run Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC and Make
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Build project
        run: make

      - name: Run tests
        run: make test
